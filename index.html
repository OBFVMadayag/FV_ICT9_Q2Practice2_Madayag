<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2Practice2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background-image: url('https://preview.redd.it/whats-your-halloween-aesthetic-inspired-by-a-video-post-i-v0-omo623ifw9q91.png?width=640&crop=smart&auto=webp&s=ec4654be5980215b7675f51268aec8732b987bfa');
            background-size: cover;
            background-repeat: no repeat;
        }

        h1{
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 25;
            background-color: rgb(135, 67, 0);
            color: rgb(255, 191, 113);
            border-radius: 10px;
            box-shadow: 5px rgb(255, 243, 221);
            font-weight: bolder;
        }

        #halloween{
            height: 240px;
            width: 240px;
        }

        #table1{
            background-color: rgb(255, 238, 206);
            padding: 5px;
        }

        table{
            border: 10px solid rgb(144, 36, 0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="text center">9 Sapphire Halloween Party 2026</h1>
            </div>
        </div>

        <br>

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWNJWRVIgQJQXFim5gh3GpV5tL6waN_LdgZVpfnte58MF64AEX3RAZIKdg&s=10" alt="halloween" id="halloween" class="img-fluid mx-auto d-block img-thumbnail">

        <br>

        <div class="row justify-content-center">
            <div class="col-lg-8" id="table1">
                <table class="table-hover table-bordered align-middle text-center border-orange">

                    <thead>
                        <tr class="display-3">
                            <th scope="col" style="width: 40;">Saturday</th>
                            <th scope="col" style="width: 40;">October</th>
                            <th scope="col" style="width: 40;">31</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr class="display-6" id="row2">
                            <td colspan="3">4:44 PM</td>
                        </tr>

                        <tr class="display-6" id="row3">
                            <td colspan="2">#666 Further Avenue Spooky Street Scary Village Nightmare City</td>
                            <td>RVSP</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
